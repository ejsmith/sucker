name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: Typecheck app
        run: npm run typecheck

      - name: Lint app
        run: npm run lint -- --max-warnings=0

      - name: Check Expo dependency alignment
        run: npm run check:expo

      - name: Run Expo Doctor
        run: npm run doctor:expo

      - name: Test app rules
        run: npm run test

      - name: Build production web bundle
        run: npm run build:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'test-only-public-key' }}
          EXPO_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY: ${{ vars.EXPO_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY }}
          EXPO_PUBLIC_EXCEPTIONLESS_API_KEY: ${{ vars.EXPO_PUBLIC_EXCEPTIONLESS_API_KEY }}
          EXPO_PUBLIC_EXCEPTIONLESS_SERVER_URL: ${{ vars.EXPO_PUBLIC_EXCEPTIONLESS_SERVER_URL }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

      - name: Check production web bundle budget
        run: npm run check:bundle-size

      - name: Install production smoke browser
        run: npx playwright install --with-deps chromium

      - name: Test production export
        run: npm run test:production

      - name: Upload tested production export
        uses: actions/upload-artifact@v7
        with:
          name: web-export
          path: dist
          retention-days: 3

      - name: Upload production test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-test-results
          path: test-results
          retention-days: 14

  computer-quality:
    name: Computer Quality (1000 games)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline
      - run: npm run test:computer-quality
      - name: Upload strategy quality measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: computer-quality
          path: test-results/computer-quality.json
          retention-days: 14

  native-config:
    name: Native Config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Generate native projects
        run: npx expo prebuild --no-install --platform all
      - name: Verify generated projects
        run: test -f ios/Podfile && test -f android/settings.gradle

  edge:
    name: Edge
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.0

      - name: Cache Deno dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-2.9.0-${{ hashFiles('supabase/functions/**/*.ts', 'supabase/tests/**/*.ts') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: Typecheck Edge Functions
        run: npm run typecheck:edge

      - name: Test Edge Functions
        run: npm run test:edge

  supabase-integration:
    name: Supabase Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.0

      - name: Cache Deno dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-2.9.0-${{ hashFiles('supabase/functions/**/*.ts', 'supabase/tests/**/*.ts') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: Prepare Supabase Edge Runtime image
        run: |
          docker pull docker.io/supabase/edge-runtime:v1.74.2
          docker tag docker.io/supabase/edge-runtime:v1.74.2 public.ecr.aws/supabase/edge-runtime:v1.74.2

      - name: Test Supabase integration
        run: npm run test:integration:supabase

      - name: Capture Supabase failure diagnostics
        if: failure()
        run: node scripts/capture-supabase-diagnostics.cjs

      - name: Upload Supabase failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: supabase-integration-diagnostics
          path: test-results/supabase
          retention-days: 14

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup || true

  web-e2e:
    name: Web E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-webkit-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium webkit

      - name: Install Playwright browser
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit

      - name: Prepare Supabase Edge Runtime image
        run: |
          docker pull docker.io/supabase/edge-runtime:v1.74.2
          docker tag docker.io/supabase/edge-runtime:v1.74.2 public.ecr.aws/supabase/edge-runtime:v1.74.2

      - name: Test web E2E
        run: npm run test:e2e:web -- --shard=${{ matrix.shard }}/4

      - name: Capture Supabase failure diagnostics
        if: failure()
        run: node scripts/capture-supabase-diagnostics.cjs

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup || true

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: |
            test-results
            blob-report
          if-no-files-found: ignore
          retention-days: 14

  web-e2e-report:
    name: Browser test report
    if: ${{ !cancelled() }}
    needs: web-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline
      - uses: actions/download-artifact@v8
        with:
          pattern: playwright-test-results-*
          path: reports
      - name: Merge shard reports
        run: |
          mkdir all-blob-reports
          find reports -name '*.zip' -path '*/blob-report/*' -exec cp {} all-blob-reports/ \;
          npx playwright merge-reports --reporter=html all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: browser-test-report
          path: playwright-report
          retention-days: 14

  build-pages:
    name: Build GitHub Pages
    needs: app
    # The authoritative Punch protocol requires a coordinated backend/client
    # rollout. See docs/releases/authoritative-punch-rollout.md before enabling.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SUCKER_PUNCH_PROTOCOL_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Validate deployment config
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "::error::Set repository variable EXPO_PUBLIC_SUPABASE_URL before deploying GitHub Pages."; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || { echo "::error::Set repository variable EXPO_PUBLIC_SUPABASE_ANON_KEY before deploying GitHub Pages."; exit 1; }
          test -n "$EXPO_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY" || { echo "::error::Set repository variable EXPO_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY before deploying GitHub Pages."; exit 1; }
          test -n "$APPLE_TEAM_ID" || { echo "::error::Set repository variable APPLE_TEAM_ID before deploying GitHub Pages."; exit 1; }
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY: ${{ vars.EXPO_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY }}
          EXPO_PUBLIC_EXCEPTIONLESS_API_KEY: ${{ vars.EXPO_PUBLIC_EXCEPTIONLESS_API_KEY }}
          EXPO_PUBLIC_EXCEPTIONLESS_SERVER_URL: ${{ vars.EXPO_PUBLIC_EXCEPTIONLESS_SERVER_URL }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

      - name: Download tested production export
        uses: actions/download-artifact@v8
        with:
          name: web-export
          path: dist

      - name: Add GitHub Pages route fallback
        run: cp dist/index.html dist/404.html

      - name: Add Apple associated domain file
        run: |
          mkdir -p dist/.well-known
          cat > dist/.well-known/apple-app-site-association <<EOF
          {
            "applinks": {
              "apps": [],
              "details": [
                {
                  "appIDs": ["${APPLE_TEAM_ID}.com.ejsmith.sucker"],
                  "components": [
                    { "/": "/invite/*" },
                    { "/": "/auth/callback" }
                  ]
                }
              ]
            }
          }
          EOF
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

      - name: Add custom domain
        run: |
          touch dist/.nojekyll
          echo "play.sucker.games" > dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy-pages:
    name: Deploy GitHub Pages
    needs:
      - app
      - computer-quality
      - edge
      - supabase-integration
      - web-e2e
      - build-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SUCKER_PUNCH_PROTOCOL_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
